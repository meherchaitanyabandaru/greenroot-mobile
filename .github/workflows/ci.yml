name: CI

permissions:
  contents: read

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Any analyzer finding fails the build, including infos (style,
      # deprecations, BuildContext used across async gaps).
      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --coverage

      # Report line coverage on the run, and stop it sliding: the floor is
      # just under today's level (17.1% on 2026-10-24); raise it as tests grow.
      - name: Coverage
        env:
          MIN_COVERAGE: '16'
        run: |
          pct=$(awk -F: '/^LF:/ {lf+=$2} /^LH:/ {lh+=$2} END {printf "%.1f", 100*lh/lf}' coverage/lcov.info)
          echo "### Mobile line coverage: ${pct}% (floor ${MIN_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v p="$pct" -v m="$MIN_COVERAGE" 'BEGIN {exit !(p >= m)}' || { echo "coverage ${pct}% fell below ${MIN_COVERAGE}%"; exit 1; }
