name: CI

permissions:
  contents: read

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.3"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Any analyzer finding fails the build, including infos (style,
      # deprecations, BuildContext used across async gaps).
      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test
