name: greenroot_mobile
description: GreenRoot — Farmer & Buyer Mobile Platform
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  cached_network_image: ^3.3.1
  cross_file: ^0.3.4+2
  crypto: ^3.0.7
  dio: ^5.4.3+1
  equatable: ^2.0.5
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.1.0
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^3.1.0
  geolocator: ^13.0.2
  go_router: ^14.6.1
  image: ^4.2.0
  image_picker: ^1.1.2
  intl: ^0.20.3
  json_annotation: ^4.9.0
  latlong2: ^0.10.1
  logger: ^2.4.0
  mobile_scanner: ^5.2.3
  package_info_plus: ^9.0.1
  path_provider: ^2.1.4
  pdf: ^3.11.1
  qr_flutter: ^4.1.0
  razorpay_flutter: ^1.4.7
  riverpod_annotation: ^4.0.0
  rxdart: ^0.28.0
  share_plus: ^10.0.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  web: ^1.1.2

dev_dependencies:
  # Appium automation (see /Users/meharbandaru/Documents/GitHub/greenroot-e2e):
  # embeds an HTTP server in integration-test builds so Appium's Flutter
  # Integration Driver can locate widgets by Key and drive the app.
  appium_flutter_server: ^0.0.33
  build_runner: ^2.6.1
  custom_lint: ^0.8.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
